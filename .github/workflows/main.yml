name: Portfolio Automation Tests
on:
  repository_dispatch:
    types: [portfolio-updated]
  push:
    branches: [main, master]
    paths:
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'playwright.config.ts'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  run-tests:
    name: Run Portfolio Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout Test Framework
      uses: actions/checkout@v4
      
    - name: Run tests inside Docker
      run: |
        docker pull srihari1018/portfolio-playwright-tests:latest || true
        docker run --rm -v "${{github.workspace}}/allure-results:/app/allure-results" \
        -v "${{github.workspace}}/allure-report:/app/allure-report" \
        srihari1018/portfolio-playwright-tests
      
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Send Email Report
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Portfolio Tests: ${{ job.status }} - ${{ github.repository }}"
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: GitHub Actions
        body: |
          Test execution completed. View detailed reports at:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Download the Allure report from the Artifacts section.
