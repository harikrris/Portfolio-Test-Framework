name: Portfolio Automation Tests
on:
  repository_dispatch:
    types: [portfolio-updated]
  push:
    branches: [main, master]
    paths:
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'playwright.config.ts'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  run-tests:
    name: Run Portfolio Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout Test Framework
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright
      run: npx playwright install --with-deps
      
    - name: Install Allure dependencies
      run: |
        npm install allure-playwright
        
    - name: Install Allure Commandline
      run: |
        sudo apt-get update
        sudo apt-get install default-jre -y
        wget -q https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
        sudo tar -zxvf allure-2.24.1.tgz -C /opt/
        sudo ln -sf /opt/allure-2.24.1/bin/allure /usr/bin/allure
      
    - name: Run Tests
      run: npx playwright test --project=regression
      
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report --single-file
      
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Send Email Report
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Portfolio Tests: ${{ job.status }} - ${{ github.repository }}"
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: GitHub Actions
        body: |
          Test execution completed. View detailed reports at:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Download the Allure report from the Artifacts section.
