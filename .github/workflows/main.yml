name: Portfolio Automation Tests
on:
  # Trigger 1: When portfolio repo is updated
  repository_dispatch:
    types: [portfolio-updated]
      # Trigger 2: When test framework itself is updated
  push:
    branches: [main, master]
    paths:
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'playwright.config.ts'
      # Trigger 3: On pull requests to test framework
  pull_request:
    branches: [main, master]
  # Trigger 4: Manual trigger
  workflow_dispatch:

jobs:
  run-tests:
    name: Run Portfolio Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout Test Framework
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright and allure
      run: |
        npx playwright install --with-deps
        npm install allure-playwright --save-dev
    
      
    - name: Run Tests
      run: npx playwright test --project=regression  --reporter=line,allure-playwright
      continue-on-error: true

    - name: Install Allure Commandline
      if: always()
      run: |
        # Install Allure command line tool
        sudo apt-get update
        sudo apt-get install -y allure

    - name: Generate Allure Report using Action
      if: always()
      uses: simple-elf/allure-report-action@v1.7
      with:
        allure_results: allure-results
        allure_report: allure-report
        gh_pages: false

    - name: Create Zip for Email
      if: always()
      run: |
        zip -r allure-report.zip allure-report/
        
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-results/
          playwright-report/

    - name: Send Email Report
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Portfolio Tests: ${{ job.status }} - ${{ github.repository }}"
        to: ${{ secrets.NOTIFICATION_EMAIL }}
        from: GitHub Actions
        body: |
          Test execution completed. View detailed reports at:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
