name: Portfolio Automation Tests
on:
  # Trigger 1: When portfolio repo is updated
  repository_dispatch:
    types: [portfolio-updated]
      # Trigger 2: When test framework itself is updated
  push:
    branches: [main, master]
    paths:
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'playwright.config.ts'
      # Trigger 3: On pull requests to test framework
  pull_request:
    branches: [main, master]
  # Trigger 4: Manual trigger
  workflow_dispatch:

jobs:
  run-tests:
    name: Run Portfolio Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout Test Framework
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright
      run: npx playwright install --with-deps
      
    - name: Run Tests
      run: npx playwright test --project=regression

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-results/
          playwright-report/
